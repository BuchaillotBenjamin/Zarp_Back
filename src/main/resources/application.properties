spring.application.name=Zarp_Back

# DATABASE (Railway MySQL)
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# MERCADO PAGO
mercadopago.access_token=${MP_ACCESS_TOKEN}
mercadopago.back_url.success=${MP_BACK_URL_SUCCESS}
mercadopago.back_url.pending=${MP_BACK_URL_PENDING}
mercadopago.back_url.failure=${MP_BACK_URL_FAILURE}
mercadopago.secret_key_webhook=${MP_SECRET_KEY_WEBHOOK}

#PAYPAL
paypal.client_id=${PP_CLIENT_ID}
paypal.client_secret=${PP_CLIENT_SECRET}
paypal.mode=${PP_MODE}
paypal.partner-attribution-id="lalalala"

#clave de encriptacion
encryption.key=${ENCRYPTION_KEY}

#MAIL
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${USUARIO}
spring.mail.password=${CONTRASENIA}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

api.url =${API_URL}

#Firebase
firebase.type=${FIREBASE_TYPE}
firebase.project_id=${FIREBASE_PROJECT_ID}
firebase.private_key_id=${FIREBASE_PRIVATE_KEY_ID}
firebase.private_key=${FIREBASE_PRIVATE_KEY}
firebase.client_email=${FIREBASE_CLIENT_EMAIL}
firebase.client_id=${FIREBASE_CLIENT_ID}
firebase.auth_uri=${FIREBASE_AUTH_URI}
firebase.token_uri=${FIREBASE_TOKEN_URI}
firebase.auth_provider_x509_cert_url=${FIREBASE_AUTH_PROVIDER_CERT}
firebase.client_x509_cert_url=${FIREBASE_CLIENT_CERT}

#CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}